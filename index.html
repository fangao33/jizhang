<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>「简记」记账 App · iPhone 交互原型</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --label:#111114; --label2:#8e8e93; --label3:#c7c7cc;
  --sep:#e5e5ea; --blue:#0a84ff; --green:#34c759; --red:#ff3b30; --orange:#ff9500;
  --purple:#af52de; --teal:#32ade6; --indigo:#5856d6; --pink:#ff2d55;
  --wx:#07c160; --ali:#1677ff; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:#050507; color:#fff; display:flex; align-items:center; justify-content:center;
  min-height:100vh; overflow-x:hidden;
}
.backdrop{position:fixed;inset:0;background:
  radial-gradient(900px 500px at 15% 10%,rgba(52,199,89,.18),transparent 60%),
  radial-gradient(800px 600px at 85% 85%,rgba(10,132,255,.20),transparent 60%),
  radial-gradient(600px 400px at 50% 50%,rgba(175,82,222,.10),transparent 70%),#050507;}
.stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px;gap:14px}
.brandline{display:flex;align-items:center;gap:10px;color:#c9c9d1;font-size:13px;letter-spacing:.4px}
.brandline b{color:#fff;font-size:15px;letter-spacing:1px}
.brandline .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}

/* ---------- iPhone frame ---------- */
.phone{
  position:relative;width:390px;height:844px;border-radius:56px;padding:11px;
  background:linear-gradient(145deg,#3a3a41,#121215 40%,#2d2d33 75%,#0c0c0e);
  box-shadow:0 0 0 2px #0a0a0c,0 40px 90px -20px rgba(0,0,0,.9),0 0 90px -30px rgba(52,199,89,.35);
  flex:none;
}
.phone::before{content:"";position:absolute;left:-3px;top:160px;width:3px;height:62px;border-radius:3px;background:#2a2a30}
.phone::after{content:"";position:absolute;right:-3px;top:190px;width:3px;height:96px;border-radius:3px;background:#2a2a30}
.screen{
  position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--bg);color:var(--label);
  display:flex;flex-direction:column;isolation:isolate;
}

.viewport{position:relative;flex:1;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 0 108px;background:var(--bg);
  padding-top:max(env(safe-area-inset-top), 26px);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.page::-webkit-scrollbar{display:none}
.page.enter{animation:pageIn .32s cubic-bezier(.32,.72,0,1)}
@keyframes pageIn{from{transform:translateX(26px);opacity:.3}to{transform:none;opacity:1}}

/* nav */
.nav{padding:4px 20px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.nav h1{font-size:30px;line-height:1.15;margin:0;letter-spacing:-.6px;font-weight:800}
.nav .sub{font-size:12.5px;color:var(--label2);margin-top:3px;font-weight:500}
.navicons{display:flex;gap:8px}
.iconbtn{
  width:34px;height:34px;border-radius:50%;background:rgba(120,120,128,.14);border:none;display:grid;place-items:center;
  color:var(--label);cursor:pointer;transition:.15s;
}
.iconbtn:active{transform:scale(.92);background:rgba(120,120,128,.26)}
.iconbtn svg{width:18px;height:18px}

.section-title{font-size:13px;font-weight:700;color:var(--label2);letter-spacing:.2px;margin:20px 20px 8px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border-radius:var(--radius);margin:0 16px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}
.card.pad{padding:16px}

/* ---------- home hero ---------- */
.hero{
  margin:2px 16px 0;border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,#1a9e57 0%,#22b06a 38%,#1677ff 100%);
  box-shadow:0 12px 26px -14px rgba(22,119,255,.65),0 8px 20px -14px rgba(26,158,87,.7);
}
.hero .halo{position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);right:-60px;top:-90px}
.hero .lbl{font-size:12.5px;opacity:.86;display:flex;align-items:center;gap:6px}
.hero .lbl .badge{background:rgba(255,255,255,.22);padding:1.5px 7px;border-radius:20px;font-size:11px;font-weight:600}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-1px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:17px;font-weight:700;opacity:.9;margin-right:2px}
.hero .row{display:flex;gap:10px;margin-top:14px;position:relative}
.hero .chip{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px}
.hero .chip b{display:block;font-size:15px;font-variant-numeric:tabular-nums;margin-top:1px}
.hero .chip span{font-size:11px;opacity:.85}
.hero .sparkline{position:absolute;right:14px;bottom:56px;opacity:.95}

/* 快捷入口 */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 16px 0}
.quick button{
  background:var(--card);border:none;border-radius:14px;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:11.5px;color:var(--label);font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:.15s;
}
.quick button:active{transform:scale(.95)}
.quick .qi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff}
.quick .qi svg{width:19px;height:19px}

/* 账单来源卡 */
.source{margin:14px 16px 0;display:flex;gap:10px}
.src{
  flex:1;background:var(--card);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.04);border:1px solid transparent;transition:.18s;position:relative;overflow:hidden;
}
.src:active{transform:scale(.97)}
.src .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:none}
.src .logo.wx{background:var(--wx)}
.src .logo.ali{background:var(--ali)}
.src .meta{line-height:1.25;min-width:0}
.src .meta b{font-size:13px;display:block}
.src .meta span{font-size:11px;color:var(--label2)}
.src .dot{position:absolute;right:10px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(52,199,89,.15)}

/* 交易列表 */
.txgroup{margin:0 16px 14px}
.txgroup .ghead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--label2);padding:0 4px 6px;font-weight:600}
.txlist{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:.5px solid var(--sep);cursor:pointer;transition:background .15s}
.tx:last-child{border-bottom:none}
.tx:active{background:#f0f0f4}
.tx .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
.tx .mid{flex:1;min-width:0;line-height:1.3}
.tx .mid b{font-size:14.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid span{font-size:11.5px;color:var(--label2);display:flex;align-items:center;gap:5px}
.tx .amt{text-align:right;flex:none;line-height:1.3}
.tx .amt b{font-size:15px;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.2px}
.tx .amt span{font-size:11px;color:var(--label2);display:block}
.badge-src{font-size:9.5px;font-weight:700;padding:0 4px;border-radius:4px;line-height:14px;display:inline-block;color:#fff}
.badge-src.wx{background:var(--wx)}
.badge-src.ali{background:var(--ali)}
.tag-uncat{font-size:9.5px;color:#fff;background:var(--orange);padding:0 4px;border-radius:4px;line-height:14px;font-weight:700}
.income{color:var(--green)} .expense{color:var(--label)}

/* tabbar */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:84px;padding:8px 6px 22px;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-top:.5px solid rgba(0,0,0,.08);z-index:20;
}
.tab{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#8e8e93;font-weight:600;cursor:pointer;padding-top:2px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--green)}

/* ---------- 统计页 ---------- */
.seg{display:flex;background:rgba(120,120,128,.12);border-radius:10px;padding:2px;margin:0 16px}
.seg button{flex:1;border:none;background:none;font-size:13px;font-weight:600;color:var(--label2);padding:6px 0;border-radius:8px;cursor:pointer;transition:.2s}
.seg button.on{background:#fff;color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.donutwrap{display:flex;flex-direction:column;align-items:center;margin:18px 0 6px;position:relative}
.donut{position:relative;width:196px;height:196px}
.donut svg{transform:rotate(-90deg)}
.donut .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.2}
.donut .center .cl{font-size:11.5px;color:var(--label2);font-weight:600}
.donut .center .cv{font-size:23px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.catlist{margin:8px 16px 0}
.catrow{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--card);border-bottom:.5px solid var(--sep);cursor:pointer}
.catrow:first-child{border-radius:14px 14px 0 0}
.catrow:last-child{border-radius:0 0 14px 14px;border-bottom:none}
.catrow:only-child{border-radius:14px}
.catrow .cdot{width:9px;height:9px;border-radius:3px;flex:none}
.catrow .cn{font-size:14px;font-weight:600}
.catrow .cp{font-size:11.5px;color:var(--label2);width:42px;text-align:right;font-variant-numeric:tabular-nums}
.catrow .ca{font-size:14px;font-weight:700;width:86px;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:#efeff2;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .6s cubic-bezier(.32,.72,0,1)}

/* ---------- 导入流程 ---------- */
.steps{margin:4px 16px 0;display:flex;flex-direction:column;gap:8px}
.step{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.step .n{width:22px;height:22px;border-radius:50%;background:rgba(120,120,128,.14);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;margin-top:1px}
.step b{font-size:14px;display:block;margin-bottom:2px}
.step p{margin:0;font-size:12.5px;color:var(--label2);line-height:1.5}
.step p em{font-style:normal;color:var(--label);font-weight:600}
.bigbtn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 32px);margin:18px 16px 0;padding:14px;border-radius:14px;border:none;
  background:var(--green);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 10px 20px -12px rgba(52,199,89,.9);transition:.15s;
}
.bigbtn:active{transform:scale(.98);filter:brightness(.94)}
.bigbtn svg{width:19px;height:19px;flex:none}
.bigbtn.ghost{background:rgba(120,120,128,.12);color:var(--label);box-shadow:none}
.mini-help{font-size:11.5px;color:var(--label2);text-align:center;margin:10px 24px 0;line-height:1.5}

/* ---------- sheet / overlay ---------- */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.34);opacity:0;pointer-events:none;transition:opacity .25s;z-index:25}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;z-index:26;transform:translateY(105%);
  transition:transform .34s cubic-bezier(.32,.72,0,1);padding-bottom:28px;max-height:88%;overflow-y:auto;scrollbar-width:none;
}
.sheet::-webkit-scrollbar{display:none}
.sheet.show{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:#d1d1d6;margin:8px auto 0}
.sheet .stitle{font-size:17px;font-weight:800;padding:14px 18px 4px}
.sheet .ssub{font-size:12.5px;color:var(--label2);padding:0 18px 10px;line-height:1.5}
.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 16px 4px}
.paycard{border:1.5px solid var(--sep);border-radius:16px;padding:14px;cursor:pointer;transition:.18s;position:relative;background:#fafafa}
.paycard:active{transform:scale(.97)}
.paycard .plogo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;margin-bottom:8px}
.paycard b{font-size:14.5px;display:block}
.paycard span{font-size:11.5px;color:var(--label2);line-height:1.4;display:block;margin-top:2px}

/* 通知条 */
.note{margin:0 16px;background:#fff8e6;border:1px solid #ffe6a8;border-radius:14px;padding:12px 14px;display:flex;gap:10px}
.note svg{width:18px;height:18px;flex:none;color:#d28b00;margin-top:1px}
.note p{margin:0;font-size:12.3px;line-height:1.55;color:#7a5b12}
.note p b{color:#5c4409}
.note.info{background:#eef6ff;border-color:#cfe5ff}
.note.info svg{color:var(--blue)}
.note.info p{color:#1b4f85}

/* 去重结果 */
.dedup{margin:0 16px;background:var(--card);border-radius:14px;overflow:hidden}
.dedup .drow{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:.5px solid var(--sep);font-size:14px}
.dedup .drow:last-child{border-bottom:none}
.dedup .drow b{font-variant-numeric:tabular-nums;font-weight:700}
.okico{width:56px;height:56px;border-radius:50%;background:rgba(52,199,89,.14);display:grid;place-items:center;margin:10px auto 6px;animation:pop .4s cubic-bezier(.32,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.okico svg{width:30px;height:30px;color:var(--green)}
.center{text-align:center}

/* 详情页 */
.detail-hero{margin:6px 16px 0;background:var(--card);border-radius:18px;padding:20px 18px 16px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.detail-hero .amt{font-size:34px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.detail-hero .merchant{font-size:14px;color:var(--label2);font-weight:600}
.detail-hero .catpill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:700;margin-top:12px;cursor:pointer}
.infocard{margin:12px 16px 0;background:var(--card);border-radius:14px;overflow:hidden}
.inforow{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:.5px solid var(--sep);font-size:14px}
.inforow:last-child{border-bottom:none}
.inforow>span:first-child{color:var(--label2);flex:none}
.inforow b{font-weight:600;text-align:right;word-break:break-all}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--label2)}
.chev{width:8px;height:8px;border-right:1.6px solid var(--label3);border-top:1.6px solid var(--label3);transform:rotate(45deg);flex:none}

/* 分类选择 */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px}
.chip-sel{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:20px;font-size:13.5px;font-weight:600;border:1.5px solid var(--sep);background:#fff;cursor:pointer;transition:.15s;color:var(--label)}
.chip-sel:active{transform:scale(.95)}
.chip-sel.on{color:#fff;border-color:transparent}
.subchips{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 6px}
.subchips button{padding:6px 12px;border-radius:16px;border:1px solid var(--sep);background:#fafafa;font-size:12.5px;font-weight:600;color:var(--label);cursor:pointer}
.subchips button.on{background:var(--label);color:#fff;border-color:var(--label)}

/* 下拉刷新 */
.ptr{position:absolute;top:0;left:0;right:0;height:0;display:flex;align-items:center;justify-content:center;color:var(--label2);font-size:12px;font-weight:600;overflow:hidden;transition:height .2s;z-index:15}
.ptr.show{height:40px}

/* toast */
.toast{
  position:absolute;left:50%;bottom:104px;transform:translate(-50%,20px);background:rgba(28,28,32,.92);color:#fff;
  padding:10px 16px;border-radius:22px;font-size:13px;font-weight:600;opacity:0;transition:.28s;z-index:60;pointer-events:none;white-space:nowrap;
  backdrop-filter:blur(10px);box-shadow:0 8px 24px -8px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 我的页 */
.profile{display:flex;align-items:center;gap:14px;margin:6px 16px 0;padding:16px;background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#22b06a,#1677ff);display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.profile .pmeta b{font-size:17px;display:block}
.profile .pmeta span{font-size:12.5px;color:var(--label2)}
.listgroup{margin:16px 16px 0;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:.5px solid var(--sep);font-size:15px;cursor:pointer}
.lrow:last-child{border-bottom:none}
.lrow:active{background:#f0f0f4}
.lrow .lic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.lrow .lic svg{width:17px;height:17px}
.lrow .lname{flex:1}
.lrow .lval{font-size:13.5px;color:var(--label2)}
.switch{width:48px;height:29px;border-radius:16px;background:#e3e3e8;position:relative;transition:.25s;flex:none;cursor:pointer}
.switch.on{background:var(--green)}
.switch::after{content:"";position:absolute;width:25px;height:25px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on::after{transform:translateX(19px)}

.hint{color:var(--label2);font-size:12px;margin:8px 20px 0;line-height:1.45}
.outside{color:#8b8b95;font-size:12px;max-width:420px;text-align:center;line-height:1.6;margin-top:6px}
.outside kbd{background:rgba(255,255,255,.12);border-radius:4px;padding:1px 5px;font-size:11px;font-family:inherit;color:#dedee5}
@media (max-width:440px){
  .phone{width:100vw;height:calc(100vh - 20px);border-radius:0;padding:0;box-shadow:none;background:none}
  .screen{border-radius:0}
  .outside{display:none}
}
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="stage">
  <div class="brandline"><span class="dot"></span><b>「简记」</b> · iPhone 记账 App 可点击原型</div>
  <div class="phone">
    <div class="screen" id="screen">
      <div class="viewport" id="viewport">
        <div class="ptr" id="ptr">↓ 松开以导入账单</div>
      </div>
      <nav class="tabbar" id="tabbar"></nav>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
  <div class="outside">单文件原型 · 按 <kbd>F12</kbd> 切到手机视图效果更接近真机。数据只存本机，不上传。</div>
</div>

<script>
/* ====================== 工具 ====================== */
const $ = (s,r=document)=>r.querySelector(s);
const money = n => n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total = arr => arr.reduce((s,t)=>s+t.amount,0);

/* ====================== 图标 ====================== */
const I = {

/* ====================== 一键记账（供 iOS 快捷指令调用） ======================
   格式：index.html?a=1.5&m=便利店&c=food&s=日用品&d=out&src=wx&n=备注&t=2026-10-20 12:00:00
   - a 金额（必填），m 商户/备注名，c 分类 id，s 子类
   - d out 支出 / in 收入，src wx / ali / manual
   - t 时间，缺省用当前时间；n 附加备注
   支持三种写法：?a=1&m=xx 、 ?key=base64(JSON) 、 ?data=密文
   ==================================================================== */
function parseQuick(raw){
  // 兼容整串 JSON，或 k=v&k=v
  let obj = {};
  try{
    const j = JSON.parse(decodeURIComponent(raw));
    if(j && typeof j==='object') obj = j;
  }catch(e){
    raw.split('&').forEach(seg=>{
      const i = seg.indexOf('=');
      if(i<0) return;
      const k = seg.slice(0,i), v = seg.slice(i+1);
      try{ obj[k] = decodeURIComponent(v.replace(/\+/g,' ')); }catch(e){ obj[k] = v; }
    });
  }
  const amount = parseFloat(String(obj.a ?? obj.amount ?? '').replace(/[^\d.]/g,''));
  if(!isFinite(amount) || amount<=0) return null;
  const dir = ['in','income','收入','入'].includes(String(obj.d||obj.dir||'')) ? 'in':'out';
  const catId = obj.c || obj.cat || null;
  return {
    merchant: (obj.m || obj.merchant || obj.title || '手动记账').slice(0,40),
    amount: Math.round(amount*100)/100,
    dir,
    cat: catId && catById(catId) ? catId : null,
    sub: obj.s || obj.sub || null,
    src: obj.src || 'manual',
    time: normTime(obj.t || obj.time),
    note: (obj.n || obj.note || '').slice(0,80),
    type: obj.type || '手动记账'
  };
}
function normTime(t){
  const d = new Date();
  if(!t) return fmtTime(d);
  const s = String(t).trim();
  const m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])} ${pad(m[4]||0)}:${pad(m[5]||0)}:${pad(m[6]||0)}`;
  return fmtTime(d);
}
const pad = n => String(n).padStart(2,'0');
const fmtTime = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const newId = () => 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* 从 URL 读取待确认的快捷指令记录 */
function readQuickFromURL(){
  const p = new URLSearchParams(location.search);
  if(p.get('a') || p.get('amount') || p.get('data') || p.get('key')){
    let raw = p.toString();
    if(p.get('data')){ try{ raw = decodeURIComponent(atob(p.get('data').replace(/-/g,'+').replace(/_/g,'/'))); }catch(e){} }
    else if(p.get('key')){ try{ raw = decodeURIComponent(atob(p.get('key').replace(/-/g,'+').replace(/_/g,'/'))); }catch(e){} }
    return parseQuick(raw);
  }
  return null;
}

function txRow(t){
  const c = t.cat ? catById(t.cat) : null;
  const sign = t.dir==='in' ? '+' : '-';
  return `<div class="tx" data-tx="${t.id}">
    <div class="ic" style="background:${c?c.color+'1f':'#8e8e931f'};color:${c?c.color:'#8e8e93'}">${c?c.icon:'❔'}</div>

      <span><i class="badge-src ${t.src}">${t.src==='wx'?'微信':'支付宝'}</i>${c?esc(c.name)+(t.sub?'·'+esc(t.sub):''):'<span class="tag-uncat">待分类</span>'}</span>
    </div>
    <div class="amt"><b class="${t.dir==='in'?'income':''}">${sign}¥${money(t.amount)}</b><span>${t.time.slice(11,16)}</span></div>
  </div>`;
}
function groupByDay(list){
  const m = new Map();
  list.forEach(t=>{ const d=t.time.slice(0,10); if(!m.has(d)) m.set(d,[]); m.get(d).push(t); });
  return [...m.entries()].sort((a,b)=>a[0]<b[0]?1:-1);
}
const dayLabel = d => {
  const dt = new Date(d+'T00:00:00');
  return `${dt.getMonth()+1}月${dt.getDate()}日 周${'日一二三四五六'[dt.getDay()]}`;
};
function heroSpark(){
  const vals=[86,142,60,210,38,96,72];
  const w=64,h=26,mx=Math.max(...vals);
  const pts = vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-v/mx*h+2).toFixed(1)}`).join(' ');
  return `<svg class="sparkline" width="${w}" height="${h}"><polyline points="${pts} ${w},${h} 0,${h}" fill="rgba(255,255,255,.18)" stroke="none"/><polyline points="${pts}" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* 按平台统计：是否已导入、多少笔、最近日期 */
function srcInfo(src){
  const list = TX.filter(t=>t.src===src);
  if(!list.length) return { has:false, text:'未导入', count:0 };
  const latest = list.map(t=>t.time).sort().pop();
  const d = latest.slice(5,10).replace('-','/');
  return { has:true, text:`${list.length} 笔 · 最近 ${d}`, count:list.length };
}

function homeSubtitle(){
  if(!TX.length) return '还没有账单 · 向下拉导入';
  const times = TX.map(t=>t.time).sort();
  const first = times[0].slice(0,10), last = times[times.length-1].slice(0,10);
  const fmt = s => `${+s.slice(5,7)}月${+s.slice(8,10)}日`;
  if(first.slice(0,7) === last.slice(0,7)){
    return `${first.slice(0,4)}年${first.slice(5,7)}月 · ${fmt(first)} - ${fmt(last)}`;
  }
  return `${first} 至 ${last}`;
}

function downloadCSV(){
  const box = $('#csvBox');
  const text = box ? box.value : '';
  const blob = new Blob([text], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `简记账单_${fmtTime(new Date()).slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

function renderStats(){
  const out = TX.filter(t=>t.dir==='out');
  const sum = total(out);
  const byCat = {};
  out.forEach(t=>{ const k=t.cat||'other'; byCat[k]=(byCat[k]||0)+t.amount; });
  const rows = Object.entries(byCat).map(([k,v])=>({k,v,c:catById(k)})).sort((a,b)=>b.v-a.v);
  const R=88, C=2*Math.PI*R;
  let off=0;
  const arcs = rows.map(r=>{
    const len = C*(r.v/sum);
    const el = `<circle cx="98" cy="98" r="${R}" fill="none" stroke="${r.c.color}" stroke-width="20"
      stroke-dasharray="${Math.max(len-4,0.1)} ${C-len+4}" stroke-dashoffset="${-off}"/>`;
    off += len; return el;
  }).join('');

  const trend = [
    {m:'5月',v:4210},{m:'6月',v:3890},{m:'7月',v:5120},{m:'8月',v:4460},{m:'9月',v:3980},{m:'10月',v:sum}
  ];
  const tmax = Math.max(...trend.map(t=>t.v));
  const bars = trend.map(t=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="font-size:10px;color:var(--label2);font-variant-numeric:tabular-nums">${(t.v/1000).toFixed(1)}k</div>
      <div style="width:100%;height:130px;display:flex;align-items:flex-end"><div style="width:100%;height:${t.v/tmax*100}%;border-radius:7px 7px 3px 3px;background:${t.m==='10月'?'linear-gradient(180deg,#34c759,#22b06a)':'#d9d9e0'}"></div></div>
      <div style="font-size:11px;color:${t.m==='10月'?'var(--label)':'var(--label2)'};font-weight:600">${t.m}</div>
    </div>`).join('');

  return `
  <div class="nav">
    <div><h1>统计</h1><div class="sub">2026年10月</div></div>
    <div class="navicons">
      <button class="iconbtn" data-act="prev-month" title="上个月">${I.back}</button>
      <button class="iconbtn" data-act="next-month" title="下个月" style="transform:scaleX(-1)">${I.back}</button>
    </div>
  </div>
  <div class="seg">
    <button class="${S.statsView==='cat'?'on':''}" data-act="view-cat">分类</button>
    <button class="${S.statsView==='trend'?'on':''}" data-act="view-trend">趋势</button>
  </div>
  ${S.statsView==='cat'?`
  <div class="donutwrap">
    <div class="donut">
      <svg width="196" height="196" viewBox="0 0 196 196">${arcs}</svg>
      <div class="center"><div>
        <div class="cl">总支出</div>
        <div class="cv">¥${money(sum)}</div>
        <div class="cl" style="margin-top:4px">较上月 ↓ 12.4%</div>
      </div></div>
    </div>
  </div>
  <div class="section-title"><span>分类排行</span><span>${rows.length} 个分类</span></div>
  <div class="catlist">
    ${rows.map(r=>`<div class="catrow" data-cat="${r.k}">
      <span class="cdot" style="background:${r.c.color}"></span>
      <div style="flex:1">
        <div style="display:flex;align-items:baseline;justify-content:space-between"><span class="cn">${r.c.icon} ${r.c.name}</span><span class="cp">${(r.v/sum*100).toFixed(1)}%</span></div>
        <div class="bar"><i style="width:${r.v/rows[0].v*100}%;background:${r.c.color}"></i></div>
      </div>
      <span class="ca">¥${money(r.v)}</span>
    </div>`).join('')}
  </div>
  <div class="hint">点分类可按该分类筛选每一笔交易。</div>
  `:`
  <div class="section-title"><span>近 6 个月支出</span><span>单位：元</span></div>
  <div class="card pad" style="padding:18px 14px">
    <div style="display:flex;gap:8px;align-items:flex-end">${bars}</div>
  </div>
  <div class="section-title"><span>本月洞察</span></div>
  <div class="card pad" style="line-height:1.7;font-size:13.5px">
    <div>🍜 <b>餐饮 ¥${money(byCat.food||0)}</b> 仍是最大开销，其中外卖占 42%。</div>
    <div style="margin-top:8px">🛍️ <b>购物</b> 比上月多花 <b style="color:var(--red)">¥1,104</b>，主要来自 10/18 京东数码 ¥1,799。</div>

async function handleFiles(files){
  if(!files || !files.length) return;
  openSheet(`<div class="grab"></div>
    <div style="padding:30px 20px 26px;text-align:center">
      <div style="width:46px;height:46px;margin:0 auto 12px;border-radius:50%;border:3px solid #e3e3e8;border-top-color:#34c759;animation:spin .8s linear infinite"></div>
      <div style="font-size:15px;font-weight:700" id="impText">正在解析账单…</div>
      <div style="font-size:12.5px;color:var(--label2);margin-top:6px">读取 ${files.length} 个文件</div>
    </div>`);

  const all = [], errors = [];
  for(const f of files){
    try{
      const list = await BillParser.parseFile(f);
      all.push(...list);
    }catch(err){
      errors.push((f.name||'文件') + '：' + err.message);
    }
  }
  if(!all.length){
    openSheet(`<div class="grab"></div>
      <div class="stitle">导入失败</div>
      <div class="ssub">${errors.join('<br>') || '没有读到可用的交易记录'}</div>
      <button class="bigbtn ghost" data-act="close-sheet" style="margin-bottom:10px">知道了</button>`);
    return;
  }

  const seen = new Set();
  TX.forEach(t=>{
    if(t.order) seen.add('o:' + t.order);
    seen.add('k:' + t.time + '|' + t.merchant + '|' + t.amount);
  });
  let dup = 0;
  const adds = [];
  for(const t of all){
    const k1 = 'o:' + t.order, k2 = 'k:' + t.time + '|' + t.merchant + '|' + t.amount;
    if((t.order && seen.has(k1)) || seen.has(k2)){ dup++; continue; }
    if(t.order) seen.add(k1);
    seen.add(k2);
    adds.push({
      id: newId(), src: t.src, time: t.time, merchant: t.merchant,
      product: t.product || '', amount: t.amount, dir: t.dir,
      type: t.type || '', status: t.status || '',
      cat: autoCategorize(t.merchant, t.type, t.product), sub: null,
      auto: true, order: t.order || '', method: t.method || '', note: t.note || ''
    });
  }
  adds.forEach(t=>{ if(t.cat) t.sub = pickSub(t.cat, t.merchant + ' ' + (t.product||'') + ' ' + (t.type||'')); });

  if(adds.length){
    TX = [...adds, ...TX].sort((a,b)=>a.time<b.time?1:-1);
    S.imported = true;
    markReal();
  }
  const uncat = adds.filter(a=>!a.cat).length;
  openSheet(renderImportResult(all.length, dup, adds.length, uncat, errors));
}

const CAT_RULES = [
  ['food',  /餐饮|外卖|奶茶|咖啡|汉堡|烤鸭|火锅|炒饭|粉|便利店|零食|蜜雪|古茗|瑞幸|塔斯汀|美团|饿了么|闪购/i],
  ['shop',  /超市|商场|百货|购物|淘宝|京东|拼多多|服饰|数码|美妆|日用|盒马|华润|万家|商行/i],
  ['traf',  /地铁|公交|打车|滴滴|出行|加油|高铁|火车|机票|共享单车|充电/i],
  ['life',  /电费|水费|燃气|话费|宽带|房租|物业|缴费|国家电网|移动|联通|电信|宿舍|饮水|淋浴|热水|洗衣/i],
  ['fun',   /电影|游戏|演出|KTV|旅游|门票|会员|订阅|Apple|iCloud|视频|音乐|网吧/i],
  ['health',/医院|药|诊所|体检|医疗|牙科/i],
  ['learn', /书店|图书|课程|培训|考试|学费|学校|学院|教材/i],
  ['other', /红包|转账|人情|收款/i]
];
function autoCategorize(merchant, type, product){
  const s = [merchant, product, type].filter(Boolean).join(' ');
  for(const [cat, re] of CAT_RULES){ if(re.test(s)) return cat; }
  return null;
}
function pickSub(cat, text){
  const c = catById(cat);
  if(!c) return null;
  const s = text || '';
  if(cat==='food'){ if(/奶茶|咖啡|果茶/.test(s)) return '咖啡奶茶'; if(/外卖/.test(s)) return '外卖'; if(/早餐/.test(s)) return '早餐'; if(/午餐/.test(s)) return '午餐'; if(/晚餐/.test(s)) return '晚餐'; return '零食'; }
  if(cat==='shop'){ if(/超市|日用|百货/.test(s)) return '日用品'; if(/数码|电子/.test(s)) return '数码'; if(/美妆/.test(s)) return '美妆'; return '服饰鞋包'; }
  if(cat==='traf'){ if(/地铁|公交/.test(s)) return '地铁公交'; if(/打车|滴滴/.test(s)) return '打车'; if(/单车/.test(s)) return '共享单车'; return '加油'; }
  if(cat==='life'){ if(/电费|水费|燃气/.test(s)) return '水电燃气'; if(/话费|宽带/.test(s)) return '话费网费'; return '房租'; }
  return c.subs[0] || null;
}

/* ===== Face ID 应用锁 =====
   用 WebAuthn 平台认证器（在 iOS Safari 上即 Face ID）。
   启用时注册一个本地凭据；之后每次打开 App 需通过一次 Face ID 验证。
   说明：这是纯前端的本地锁，无法抵御能直接读到设备文件的高级攻击，
   但足以防止别人拿起你手机随手翻账本。 */
const LOCK_KEY = 'jianji.lock.v1';   // '1' 表示已启用
const CRED_KEY = 'jianji.lock.cred'; // 凭据 id（base64）

const hasWebAuthn = ()=> !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
async function platformAvailable(){
  if(!hasWebAuthn()) return false;
  try{
    if(PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable){
      return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    }
  }catch(e){}
  return true;
}
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));

/* 启用：注册本地凭据并做一次验证 */
async function enableLock(){
  if(!hasWebAuthn()){
    toast('当前浏览器不支持面容验证');
    return false;
  }
  try{
    const cred = await navigator.credentials.create({
      publicKey:{
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp:{ name:'简记' },
        user:{ id: crypto.getRandomValues(new Uint8Array(16)), name:'jianji-user', displayName:'简记用户' },
        pubKeyCredParams:[{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
        authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
        timeout: 60000,
        attestation:'none'
      }
    });
    if(!cred) return false;
    try{
      localStorage.setItem(CRED_KEY, b64(cred.rawId));
      localStorage.setItem(LOCK_KEY, '1');
    }catch(e){}
    S.toggles.lock = true;
    return true;
  }catch(e){
    // 用户取消或设备不支持
    return false;
  }
}

/* 验证：用已注册凭据做一次 Face ID */
async function verifyLock(){
  // 没有凭据记录时，退化为直接放行（避免把自己锁死）
  let credId = null;
  try{ credId = localStorage.getItem(CRED_KEY); }catch(e){}
  if(!credId) return true;
  try{
    const opts = {
      publicKey:{
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        timeout: 60000,
        userVerification:'required',
        allowCredentials:[{ type:'public-key', id: unb64(credId) }]
      }
    };
    const res = await navigator.credentials.get(opts);
    return !!res;
  }catch(e){
    return false;
  }
}

function lockEnabled(){
  try{ return localStorage.getItem(LOCK_KEY)==='1'; }catch(e){ return false; }
}
function disableLock(){
  try{ localStorage.removeItem(LOCK_KEY); localStorage.removeItem(CRED_KEY); }catch(e){}
  S.toggles.lock = false;
}

    </div>`;
  document.getElementById('screen').appendChild(overlay);

  const btn = overlay.querySelector('#lockBtn');
  const msg = overlay.querySelector('#lockMsg');
  const attempt = async () => {
    btn.style.opacity = '.6';
    msg.textContent = '正在验证…';
    const ok = await verifyLock();
    if(ok){ overlay.remove(); }
    else { msg.textContent = '验证未通过，请重试'; btn.style.opacity = '1'; }
  };
  btn.addEventListener('click', attempt);
  setTimeout(attempt, 350); // 进入即自动唤起 Face ID
}

function saveQuick(q){
  const rec = {
    id: newId(),
    src: q.src || 'manual',
    time: q.time,
    merchant: q.merchant,
    product: q.note || '',
    amount: q.amount,
    dir: q.dir,
    type: q.type || '手动记账',
    cat: q.cat || null,
    sub: q.sub || null,
    auto: !!q.cat,
    order: 'Q' + Date.now(),
    note: q.note || ''
  };
  TX = [rec, ...TX].sort((a,b)=>a.time<b.time?1:-1);
  S.imported = true;
  markReal();
  S.quickPending = null;
  closeSheet();
  const url = location.origin + location.pathname + location.hash;
  history.replaceState(null, '', url);
  S.tab = 'home'; S.detailId = null; S._scrollTop = 0;
  rerender();
  setTimeout(()=>toast('已记账 ¥' + money(rec.amount)), 200);
}

document.addEventListener('click', e=>{

  if(act === 'quick-save'){ if(S.quickPending) saveQuick(S.quickPending); return; }

    navigator.clipboard.writeText(txt).then(()=>toast('CSV 已复制'),()=>toast('复制失败，请用导出按钮'));

  if(act === 'open-export'){ openSheet(renderExportSheet()); return; }

/* ============================================================
   通用账单解析器  BillParser
   支持：支付宝 CSV（GBK，前言 24 行）、微信 XLSX（前言 18 行）
   输出统一结构：{time, merchant, product, amount, dir, type, status, order, note, method}
   ============================================================ */
const BillParser = (() => {

  /* ---------- GBK 解码（支付宝 CSV） ---------- */
  function decodeGBK(buf) {
    // 优先用浏览器内置 TextDecoder('gbk')，Safari 10.1+ 支持
    try {
      return new TextDecoder('gbk').decode(buf);
    } catch (e) { /* 继续尝试下面 */ }
    try {
      return new TextDecoder('gb18030').decode(buf);
    } catch (e) { }
    // 兜底：按 latin1 读出，中文会乱码但不崩溃
    let s = '';
    const u8 = new Uint8Array(buf);
    for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
    return s;
  }
  function decodeAuto(buf) {
    const u8 = new Uint8Array(buf);
    // BOM 判断
    if (u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF)
      return new TextDecoder('utf-8').decode(buf);
    // 尝试 UTF-8，非法则回落 GBK
    try {
      const s = new TextDecoder('utf-8', { fatal: true }).decode(buf);
      if (/[\u4e00-\u9fa5]/.test(s)) return s;
    } catch (e) { }
    return decodeGBK(buf);
  }

  /* ---------- 简易 CSV 解析（支持引号包裹与换行） ---------- */
  function parseCSV(text) {
    const rows = [];
    let row = [], cell = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; }
          else inQ = false;
        } else cell += c;
      } else {
        if (c === '"') inQ = true;
        else if (c === ',') { row.push(cell); cell = ''; }
        else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
        else if (c === '\r') { /* skip */ }
        else cell += c;
      }
    }
    if (cell.length || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  /* ---------- XLSX 解析（纯前端，读 zip → sharedStrings + sheet1） ---------- */
  async function readZip(buf) {
    // 解析 zip 中央目录，取出需要的 XML
    const dv = new DataView(buf);
    const u8 = new Uint8Array(buf);
    // 找 EOCD
    let eocd = -1;
    for (let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('不是有效的 xlsx');
    const cdCount = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const files = {};
    for (let n = 0; n < cdCount; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const usize = dv.getUint32(p + 24, true);
      const nlen = dv.getUint16(p + 28, true);
      const elen = dv.getUint16(p + 30, true);
      const clen = dv.getUint16(p + 32, true);
      const lho = dv.getUint32(p + 42, true);
      let name = '';
      for (let i = 0; i < nlen; i++) name += String.fromCharCode(u8[p + 46 + i]);
      files[name] = { method, csize, usize, lho };
      p += 46 + nlen + elen + clen;
    }
    async function get(name) {
      const f = files[name];
      if (!f) return null;
      const lp = f.lho;
      const nlen = dv.getUint16(lp + 26, true);
      const elen = dv.getUint16(lp + 28, true);
      const start = lp + 30 + nlen + elen;
      const data = u8.subarray(start, start + f.csize);
      if (f.method === 0) return new TextDecoder('utf-8').decode(data);
      if (f.method === 8) {
        if (typeof DecompressionStream === 'undefined') throw new Error('当前浏览器不支持解压 xlsx，请改用 Safari 或最新版浏览器');
        const ds = new DecompressionStream('deflate-raw');
        const stream = new Blob([data]).stream().pipeThrough(ds);
        const ab = await new Response(stream).arrayBuffer();
        return new TextDecoder('utf-8').decode(ab);
      }
      return null;
    }
    return { files, get };
  }

  function xmlText(xml) {
    return xml.replace(/<[^>]+>/g, '');
  }
  function unescapeXml(s) {
    return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
      .replace(/&quot;/g, '"').replace(/&apos;/g, "'");
  }

  async function parseXLSX(buf) {
    const zip = await readZip(buf);
    const sharedXml = await zip.get('xl/sharedStrings.xml') || '';
    const shared = [];
    const siRe = /<si[\s>][\s\S]*?<\/si>|<si\/>/g;
    const sis = sharedXml.match(siRe) || [];
    for (const si of sis) {
      const ts = si.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [];
      shared.push(ts.map(t => unescapeXml(xmlText(t))).join(''));
    }
    let sheetXml = await zip.get('xl/worksheets/sheet1.xml');
    if (!sheetXml) {
      for (const k of Object.keys(zip.files)) {
        if (/^xl\/worksheets\/sheet\d+\.xml$/.test(k)) { sheetXml = await zip.get(k); break; }
      }
    }
    if (!sheetXml) throw new Error('找不到工作表');
    const rows = [];
    const rowRe = /<row[^>]*>([\s\S]*?)<\/row>/g;
    let rm;
    while ((rm = rowRe.exec(sheetXml))) {
      const cells = [];
      const cellRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
      let cm;
      while ((cm = cellRe.exec(rm[1]))) {
        const attrs = cm[1] || '';
        const body = cm[2] || '';
        // 按单元格坐标（A/B/C…）定位，避免空单元格导致错位
        const refM = attrs.match(/\br="([A-Z]+)\d+"/);
        const colIdx = refM ? colLetterToIndex(refM[1]) : cells.length;
        const t = (attrs.match(/\bt="([^"]+)"/) || [])[1];
        let v = '';
        if (t === 's') {
          const idxM = body.match(/<v>([\s\S]*?)<\/v>/);
          if (idxM) v = shared[parseInt(idxM[1], 10)] || '';
        } else if (t === 'inlineStr') {
          const ts = body.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [];
          v = ts.map(x => unescapeXml(xmlText(x))).join('');
        } else {
          const vm = body.match(/<v>([\s\S]*?)<\/v>/);
          v = vm ? unescapeXml(vm[1]) : '';
        }
        cells[colIdx] = v;
      }
      const filled = [];
      for (let i = 0; i < cells.length; i++) filled.push(cells[i] === undefined ? '' : cells[i]);
      rows.push(filled);
    }
    return rows;
  }

  /* 列字母转索引：A=0, B=1, ... AA=26 */
  function colLetterToIndex(s) {
    let n = 0;
    for (let i = 0; i < s.length; i++) n = n * 26 + (s.charCodeAt(i) - 64);
    return n - 1;
  }

  /* Excel 日期序列号 → 'YYYY-MM-DD HH:mm:ss'
     序列号本身即本地时间，不做时区偏移 */
  function excelSerialToTime(v) {
    const n = parseFloat(v);
    if (!isFinite(n) || n <= 0) return null;
    const ms = Math.round((n - 25569) * 86400 * 1000); // 25569 = 1970-01-01
    const d = new Date(ms);
    if (isNaN(d.getTime())) return null;
    const p = x => String(x).padStart(2, '0');
    return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())}`;
  }

  /* ---------- 工具 ---------- */
  const norm = s => (s == null ? '' : String(s))
    .replace(/\t/g, '')
    .replace(/^\uFEFF/, '')
    .replace(/^"+|"+$/g, '')   // 去掉首尾包裹的引号
    .trim();
  const isSlash = s => s === '/' || s === '' || s == null;
  function toAmount(s) {
    const t = norm(s).replace(/[¥￥,]/g, '').replace(/[^\d.\-]/g, '');
    const v = parseFloat(t);
    return isFinite(v) ? Math.abs(Math.round(v * 100) / 100) : 0;
  }
  function normTime(s) {
    const t = norm(s);
    const m = t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
    if (!m) return null;
    const p = n => String(n).padStart(2, '0');
    return `${m[1]}-${p(m[2])}-${p(m[3])} ${p(m[4] || 0)}:${p(m[5] || 0)}:${p(m[6] || 0)}`;
  }

  /* ---------- 支付宝 CSV ---------- */
  function parseAlipay(text) {
    const rows = parseCSV(text);
    let head = -1, cols = null;
    for (let i = 0; i < Math.min(rows.length, 60); i++) {
      const r = rows[i].map(norm);
      if (r.includes('交易时间') && r.some(c => c.startsWith('收/支') || c === '收/支')) {
        head = i; cols = r; break;
      }
    }
    if (head < 0) return null;
    const idx = (name) => {
      // 精确匹配优先，其次用「以该名开头」兜底（表头可能带单位/空格）
      let k = cols.findIndex(c => c === name);
      if (k < 0) k = cols.findIndex(c => c.startsWith(name));
      return k;
    };
    const iTime = idx('交易时间'), iCat = idx('交易分类'), iMer = idx('交易对方');
    const iProd = idx('商品说明'), iDir = idx('收/支'), iAmt = idx('金额');
    const iWay = idx('收/付款方式'), iSt = idx('交易状态'), iOrd = idx('交易订单号'), iNote = idx('备注');
    const out = [];
    for (let i = head + 1; i < rows.length; i++) {
      const r = rows[i]; if (!r || r.length < 5) continue;
      const time = normTime(r[iTime]); if (!time) continue;
      const amt = toAmount(r[iAmt]); if (!amt) continue;
      const dirRaw = norm(r[iDir]);
      const status = norm(r[iSt]);
      const note = norm(iNote >= 0 ? r[iNote] : '');
      if (status.includes('交易关闭')) continue;               // 钱没出去
      let dir = 'out';
      if (dirRaw === '收入') dir = 'in';
      else if (dirRaw === '不计收支') dir = 'neutral';          // 小荷包等
      else if (dirRaw !== '支出') dir = 'neutral';
      if (status.includes('退款')) dir = 'in';                  // 退款算冲抵
      out.push({
        src: 'ali', time, merchant: norm(r[iMer]) || '未知商户',
        product: norm(iProd >= 0 ? r[iProd] : ''), amount: amt, dir,
        type: norm(iCat >= 0 ? r[iCat] : ''), status, order: norm(r[iOrd]),
        method: norm(iWay >= 0 ? r[iWay] : ''), note: isSlash(note) ? '' : note
      });
    }
    return out;
  }

  /* ---------- 微信 XLSX ---------- */
  function parseWechat(rows) {
    let head = -1, cols = null;
    for (let i = 0; i < Math.min(rows.length, 60); i++) {
      const r = (rows[i] || []).map(norm);
      if (r.includes('交易时间') && r.includes('交易对方')) { head = i; cols = r; break; }
    }
    if (head < 0) return null;
    const idx = (name) => cols.findIndex(c => c === name || c.startsWith(name));
    const iTime = idx('交易时间'), iType = idx('交易类型'), iMer = idx('交易对方');
    const iProd = idx('商品'), iDir = idx('收/支'), iAmt = idx('金额');
    const iWay = idx('支付方式'), iSt = idx('当前状态'), iOrd = idx('交易单号'), iNote = idx('备注');
    const out = [];
    for (let i = head + 1; i < rows.length; i++) {
      const r = rows[i]; if (!r || r.length < 5) continue;
      // 微信 xlsx 的时间可能是 Excel 序列号，也可能是文本
      let time = normTime(r[iTime]);
      if (!time) time = excelSerialToTime(r[iTime]);
      if (!time) continue;
      const amt = toAmount(r[iAmt]); if (!amt) continue;
      const dirRaw = norm(r[iDir]);
      const status = norm(r[iSt]);
      const type = norm(r[iType]);
      const noteRaw = norm(iNote >= 0 ? r[iNote] : '');
      let dir;
      if (dirRaw === '收入') dir = 'in';
      else if (dirRaw === '支出') dir = 'out';
      else dir = 'neutral';                                    // "/" 中性
      // 提现/充值/还款视为中性
      if (/提现|充值|还款|转入零钱通|零钱通/.test(type)) dir = 'neutral';
      if (/退款/.test(status) || /退款/.test(type)) dir = 'in';
      out.push({
        src: 'wx', time, merchant: norm(r[iMer]) || '未知商户',
        product: isSlash(norm(iProd >= 0 ? r[iProd] : '')) ? '' : norm(r[iProd]),
        amount: amt, dir, type, status, order: norm(r[iOrd]),
        method: isSlash(norm(iWay >= 0 ? r[iWay] : '')) ? '' : norm(r[iWay]),
        note: isSlash(noteRaw) ? '' : noteRaw
      });
    }
    return out;
  }

  /* ---------- 对外入口 ---------- */
  async function parseFile(file) {
    const name = (file.name || '').toLowerCase();
    const buf = await file.arrayBuffer();
    if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
      const rows = await parseXLSX(buf);
      const wx = parseWechat(rows);
      const ali = parseAlipay(rows.map(r => (r || []).join(',')) .join('\n'));
      const list = wx || ali;
      if (!list) throw new Error('无法识别表格结构（不是微信/支付宝账单？）');
      return list;
    }
    const text = decodeAuto(buf);
    const ali = parseAlipay(text);
    if (ali) return ali;
    const wx = parseWechat(parseCSV(text));
    if (wx) return wx;
    throw new Error('无法识别文件格式，请确认是支付宝或微信官方导出的账单');
  }

  return { parseFile, parseAlipay, parseWechat, parseCSV, decodeAuto, normTime, toAmount };
})();
